<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 660" font-family="Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#456"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a6faf"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1180" height="660" fill="#ffffff"/>
  <text x="590" y="30" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a2733">AME-Chip — decode accelerator SoC (block diagram)</text>
  <text x="590" y="52" text-anchor="middle" font-size="13" fill="#5a6a7a">RV32IM control core + AME INT8 matrix engine · AXI4-Lite fabric · SkyWater sky130hd · 94.78 MHz signoff</text>

  <!-- die frame -->
  <rect x="24" y="66" width="1132" height="574" rx="10" fill="#f4f7fa" stroke="#8aa" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="42" y="90" font-size="13" font-weight="bold" fill="#5a6a7a">AME-Chip die — 4.524 mm² (instances 3.455 mm²) · single clock domain 94.78 MHz</text>

  <!-- CPU -->
  <rect x="56" y="110" width="250" height="150" rx="8" fill="#e3ecf7" stroke="#3a6ea5" stroke-width="2"/>
  <text x="181" y="136" text-anchor="middle" font-size="16" font-weight="bold" fill="#1a3a5c">RV32IM Core</text>
  <text x="181" y="158" text-anchor="middle" font-size="12" fill="#334">5-stage in-order pipeline</text>
  <text x="181" y="176" text-anchor="middle" font-size="12" fill="#334">custom-0 coproc decode</text>
  <text x="181" y="194" text-anchor="middle" font-size="12" fill="#334">control flow only —</text>
  <text x="181" y="212" text-anchor="middle" font-size="12" fill="#334">all tensor math in AME</text>
  <text x="181" y="240" text-anchor="middle" font-size="11" fill="#667" fill-opacity="0.9">ISS-differential verified</text>

  <!-- coproc arrow -->
  <line x1="306" y1="170" x2="408" y2="170" stroke="#456" stroke-width="2.5" marker-end="url(#arr)" marker-start="url(#arr)"/>
  <text x="357" y="158" text-anchor="middle" font-size="11" fill="#456">coproc IF</text>
  <text x="357" y="188" text-anchor="middle" font-size="11" fill="#456">(blocking)</text>

  <!-- AME -->
  <rect x="410" y="104" width="420" height="196" rx="8" fill="#e2f2e6" stroke="#2e7d4f" stroke-width="2.5"/>
  <text x="620" y="130" text-anchor="middle" font-size="16" font-weight="bold" fill="#1c4f30">AME — INT8 Matrix Engine</text>
  <text x="620" y="152" text-anchor="middle" font-size="12" fill="#234">16 MAC lanes × K-dim time-sharing = 16 MAC/cycle</text>
  <text x="620" y="170" text-anchor="middle" font-size="12" fill="#234">INT32 saturating accumulate (bias-first) · per-channel requant</text>
  <text x="620" y="188" text-anchor="middle" font-size="12" fill="#234">GEMV/GEMM FSM · 74-case golden bit-exact</text>
  <rect x="430" y="204" width="180" height="44" rx="5" fill="#cde9d6" stroke="#2e7d4f"/>
  <text x="520" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c4f30">WBUF 1 KB</text>
  <text x="520" y="240" text-anchor="middle" font-size="10.5" fill="#345">SRAM macro</text>
  <rect x="620" y="204" width="180" height="44" rx="5" fill="#cde9d6" stroke="#2e7d4f"/>
  <text x="710" y="223" text-anchor="middle" font-size="12" font-weight="bold" fill="#1c4f30">XBUF 1 KB</text>
  <text x="710" y="240" text-anchor="middle" font-size="10.5" fill="#345">SRAM macro</text>
  <text x="620" y="286" text-anchor="middle" font-size="11" fill="#456">tile streaming from XMEM — weights never fully resident</text>

  <!-- XMEM interface -->
  <rect x="968" y="104" width="170" height="330" rx="8" fill="#fdf1e0" stroke="#c77d1f" stroke-width="2"/>
  <text x="1053" y="130" text-anchor="middle" font-size="14" font-weight="bold" fill="#7a4d0f">XMEM IF</text>
  <text x="1053" y="150" text-anchor="middle" font-size="12" fill="#654">16-bit · off-chip</text>
  <text x="1053" y="186" text-anchor="middle" font-size="12" fill="#654">weights ≈2.1 MB</text>
  <text x="1053" y="206" text-anchor="middle" font-size="12" fill="#654">KV-cache ≤256 KB</text>
  <text x="1053" y="226" text-anchor="middle" font-size="12" fill="#654">program image</text>
  <text x="1053" y="266" text-anchor="middle" font-size="11" fill="#986">streamed in tiles:</text>
  <text x="1053" y="284" text-anchor="middle" font-size="11" fill="#986">235 MB/s (DMA,</text>
  <text x="1053" y="302" text-anchor="middle" font-size="11" fill="#986">meets budget)</text>
  <text x="1053" y="340" text-anchor="middle" font-size="11" fill="#986">bandwidth wall</text>
  <text x="1053" y="358" text-anchor="middle" font-size="11" fill="#986">≈119 tok/s — the</text>
  <text x="1053" y="376" text-anchor="middle" font-size="11" fill="#986">workload's physical</text>
  <text x="1053" y="394" text-anchor="middle" font-size="11" fill="#986">ceiling</text>

  <!-- xbar -->
  <rect x="56" y="330" width="740" height="64" rx="8" fill="#ece4f4" stroke="#6a4a9c" stroke-width="2"/>
  <text x="426" y="358" text-anchor="middle" font-size="15" font-weight="bold" fill="#3d2a63">AXI4-Lite crossbar</text>
  <text x="426" y="378" text-anchor="middle" font-size="12" fill="#443">4 masters / 9 slaves · round-robin · DECERR routing · measured worst CPU latency 29 cycles</text>

  <!-- masters connecting down -->
  <line x1="181" y1="260" x2="181" y2="330" stroke="#456" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="620" y1="300" x2="620" y2="330" stroke="#456" stroke-width="2" marker-end="url(#arr)"/>
  <text x="648" y="322" font-size="11" fill="#456">window access</text>

  <!-- slaves row -->
  <rect x="56" y="440" width="170" height="90" rx="6" fill="#fff" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="141" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">OC SRAM 4 KB</text>
  <text x="141" y="486" text-anchor="middle" font-size="11" fill="#345">program + data</text>
  <text x="141" y="504" text-anchor="middle" font-size="11" fill="#345">SRAM macro</text>

  <rect x="240" y="440" width="150" height="90" rx="6" fill="#fff" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="315" y="466" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">Boot ROM</text>
  <text x="315" y="486" text-anchor="middle" font-size="11" fill="#345">2 KB constant</text>
  <text x="315" y="504" text-anchor="middle" font-size="11" fill="#345">mux tree (md5-frozen)</text>

  <rect x="404" y="440" width="180" height="90" rx="6" fill="#e2f2e6" stroke="#2e7d4f" stroke-width="1.5"/>
  <text x="494" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#1c4f30">KV-cache ctrl</text>
  <text x="494" y="482" text-anchor="middle" font-size="11" fill="#345">append / head-stream read</text>
  <text x="494" y="500" text-anchor="middle" font-size="11" fill="#345">TRANSPOSE/SLICE (P·V)</text>
  <text x="494" y="518" text-anchor="middle" font-size="11" fill="#345">2 backends (XMEM / banks)</text>

  <rect x="598" y="440" width="198" height="90" rx="6" fill="#fff" stroke="#3a6ea5" stroke-width="1.5"/>
  <text x="697" y="464" text-anchor="middle" font-size="13" font-weight="bold" fill="#1a3a5c">UART · INTC · SYS-CSR</text>
  <text x="697" y="486" text-anchor="middle" font-size="11" fill="#345">token output / error inject</text>
  <text x="697" y="504" text-anchor="middle" font-size="11" fill="#345">version / status / IRQ</text>

  <!-- DMA -->
  <rect x="56" y="560" width="340" height="66" rx="6" fill="#fbe9ec" stroke="#b04a5a" stroke-width="1.5"/>
  <text x="226" y="584" text-anchor="middle" font-size="13" font-weight="bold" fill="#6d2530">2D DMA engine</text>
  <text x="226" y="606" text-anchor="middle" font-size="11.5" fill="#544">weight-tile streaming + KV moves · 235 MB/s measured (meets §9 budget)</text>
  <line x1="226" y1="560" x2="226" y2="394" stroke="#456" stroke-width="2" marker-end="url(#arr)"/>

  <!-- XMEM arrows -->
  <line x1="968" y1="200" x2="830" y2="200" stroke="#1a6faf" stroke-width="2.5" marker-end="url(#arrB)"/>
  <text x="899" y="190" text-anchor="middle" font-size="11" fill="#1a6faf">ld.w tiles</text>
  <line x1="968" y1="250" x2="584" y2="438" stroke="#1a6faf" stroke-width="2" marker-end="url(#arrB)"/>
  <text x="790" y="330" text-anchor="middle" font-size="11" fill="#1a6faf">KV read/write</text>

  <!-- decode flow annotation -->
  <rect x="600" y="560" width="536" height="66" rx="6" fill="#eef3f8" stroke="#9ab" stroke-width="1.2"/>
  <text x="868" y="584" text-anchor="middle" font-size="12.5" font-weight="bold" fill="#2a3a4a">One decode step (measured): 6,178,210 cycles = 65.19 ms → 15.3 tok/s</text>
  <text x="868" y="606" text-anchor="middle" font-size="11.5" fill="#445">boot → DMA pulls weight tiles → per-layer GEMV+requant → KV append/read → token via UART</text>

  <!-- XMEM to off-die -->
  <line x1="1138" y1="270" x2="1170" y2="270" stroke="#c77d1f" stroke-width="3" marker-end="url(#arr)"/>
  <text x="1152" y="256" text-anchor="middle" font-size="11" fill="#986">off-die</text>
</svg>
